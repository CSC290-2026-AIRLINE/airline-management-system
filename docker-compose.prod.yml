services:
  postgres:
    image: postgres:16-alpine
    container_name: airline_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-airline_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: airline_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    container_name: airline_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadminpassword; do sleep 1; done;
      mc mb --ignore-existing local/airline-public;
      mc mb --ignore-existing local/airline-private;
      mc anonymous set download local/airline-public;
      exit 0;
      "

  # NOTE: no "build:" key on backend/customer-web/staff-web below —
  # the VM only ever pulls these from Docker Hub, it never builds them.
  # Replace DOCKERHUB_USER with your actual Docker Hub namespace (or set
  # it in the VM's .env file).

  backend:
    image: ${DOCKERHUB_USER}/airline-backend:${IMAGE_TAG:-latest}
    container_name: airline_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-airline_db}?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CLERK_SECRET_KEY_CUSTOMER: ${CLERK_SECRET_KEY_CUSTOMER}
      CLERK_SECRET_KEY_STAFF: ${CLERK_SECRET_KEY_STAFF}
      CUSTOMER_WEB_ORIGIN: ${CUSTOMER_WEB_ORIGIN}
      STAFF_WEB_ORIGIN: ${STAFF_WEB_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy

  customer-web:
    image: ${DOCKERHUB_USER}/airline-customer-web:${IMAGE_TAG:-latest}
    container_name: airline_customer_web
    restart: always
    ports:
      - "5151:80"

  staff-web:
    image: ${DOCKERHUB_USER}/airline-staff-web:${IMAGE_TAG:-latest}
    container_name: airline_staff_web
    restart: always
    ports:
      - "6161:80"

volumes:
  pgdata:
  miniodata:

services:
  postgres:
    image: postgres:18-alpine
    platform: linux/amd64
    container_name: airline_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-airline_db}
    # Bound to the VM's own loopback only. Docker-published ports bypass ufw,
    # so "5432:5432" would be reachable from the network even with ufw closed.
    # The backend reaches Postgres over the Docker network (postgres:5432).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. Replaces MinIO, whose official images were
  # pulled from Docker Hub and quay.io (Sept 2026).
  # S3 endpoint inside the Docker network: http://seaweedfs:8333
  # Buckets are NOT created automatically — see the one-time commands in the
  # deployment notes (s3.bucket.create via `weed shell`).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    platform: linux/amd64
    container_name: airline_seaweedfs
    restart: always
    command: server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.config=/etc/seaweedfs/s3.json
    # Loopback only (testing from the VM). The backend uses seaweedfs:8333
    # over the Docker network. Browsers would need this published publicly
    # to fetch public files directly — decide that when the feature exists.
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfsdata:/data
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json

  # NOTE: no "build:" key on backend/customer-web/staff-web below —
  # the VM only ever pulls these from Docker Hub, it never builds them.
  # Replace DOCKERHUB_USER with your actual Docker Hub namespace (or set
  # it in the VM's .env file).

  backend:
    image: ${DOCKERHUB_USER}/airline-backend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: airline_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-airline_db}?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CLERK_SECRET_KEY_CUSTOMER: ${CLERK_SECRET_KEY_CUSTOMER}
      CLERK_SECRET_KEY_STAFF: ${CLERK_SECRET_KEY_STAFF}
      CUSTOMER_WEB_ORIGIN: ${CUSTOMER_WEB_ORIGIN}
      STAFF_WEB_ORIGIN: ${STAFF_WEB_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy

  customer-web:
    image: ${DOCKERHUB_USER}/airline-customer-web:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: airline_customer_web
    restart: always
    ports:
      - "5151:80"

  staff-web:
    image: ${DOCKERHUB_USER}/airline-staff-web:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: airline_staff_web
    restart: always
    ports:
      - "6161:80"

volumes:
  pgdata:
  seaweedfsdata:

# Needs Docker Compose >= 2.23.1 (check: docker compose version).
# ${...} values are filled in from the VM's .env file.
configs:
  seaweedfs_s3:
    content: |
      {
        "identities": [
          {
            "name": "anonymous",
            "actions": ["Read:airline-public", "List:airline-public"]
          },
          {
            "name": "app",
            "credentials": [
              { "accessKey": "${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}", "secretKey": "${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}" }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }

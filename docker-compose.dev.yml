services:
  postgres:
    image: postgres:16-alpine
    container_name: airline_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: airline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: airline_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 256M

  minio-create-buckets:
    image: minio/mc:latest
    container_name: airline_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword; do
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/airline-public;
      /usr/bin/mc mb --ignore-existing local/airline-private;
      /usr/bin/mc anonymous set download local/airline-public;
      echo 'Buckets created successfully!';
      exit 0;
      "

volumes:
  pgdata:
  miniodata:

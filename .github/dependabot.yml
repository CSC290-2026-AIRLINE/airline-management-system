# Weekly dependency update PRs against dev. Minor and patch updates are
# grouped into one PR per ecosystem to keep the review load low; major
# updates still get their own PR because they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(core)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(core)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/customer-web
      - /apps/staff-web
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(core)

  # Keeps the pinned images in docker-compose*.yml (SeaweedFS, Postgres) current.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(core)

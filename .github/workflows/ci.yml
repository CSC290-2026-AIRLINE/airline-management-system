name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # TODO: confirm pnpm version once scaffolded

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # TODO: replace with actual Node version once known
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # NOTE: this step will fail until package.json + pnpm-lock.yaml exist at repo root
        # once scaffolded, this becomes real

      # ---- Backend ----
      - name: Lint backend
        run: pnpm --filter backend lint
        continue-on-error: true # TODO: remove once backend is scaffolded and script exists

      - name: Build backend
        run: pnpm --filter backend build
        continue-on-error: true # TODO: remove once backend is scaffolded

      # ---- Frontend ----
      - name: Lint frontend
        run: pnpm --filter frontend lint
        continue-on-error: true # TODO: remove once frontend is scaffolded

      - name: Build frontend
        run: pnpm --filter frontend build
        continue-on-error: true # TODO: remove once frontend is scaffolded
name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=db/prisma/schema.prisma

      # ---- Backend ----
      - name: Lint backend
        run: npm run lint -w apps/backend

      - name: Build backend
        run: npm run build -w apps/backend

      # ---- Customer Web ----
      - name: Lint customer-web
        run: npm run lint -w apps/customer-web

      - name: Build customer-web
        run: npm run build -w apps/customer-web

      # ---- Staff Web ----
      - name: Lint staff-web
        run: npm run lint -w apps/staff-web

      - name: Build staff-web
        run: npm run build -w apps/staff-web
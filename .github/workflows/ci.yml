name: CI

on:
  pull_request:
    branches: [dev, main]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      # ---- Backend ----
      - name: Lint backend
        run: npm run lint -w apps/backend

      - name: Check backend formatting
        run: npm run format:check -w apps/backend

      - name: Test backend
        run: npm run test -w apps/backend

      - name: Build backend
        run: npm run build -w apps/backend

      # ---- Customer Web ----
      - name: Lint customer-web
        run: npm run lint -w apps/customer-web

      - name: Check customer-web formatting
        run: npm run format:check -w apps/customer-web

      - name: Build customer-web
        run: npm run build -w apps/customer-web

      # ---- Staff Web ----
      - name: Lint staff-web
        run: npm run lint -w apps/staff-web

      - name: Check staff-web formatting
        run: npm run format:check -w apps/staff-web

      - name: Build staff-web
        run: npm run build -w apps/staff-web

  # Applies every migration to an empty database, checks the result matches
  # schema.prisma, then runs the seed script against it.
  database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Check migrations match schema.prisma
        run: |
          npm exec -w apps/backend -- prisma migrate diff \
            --from-config-datasource \
            --to-schema src/db/prisma/schema.prisma \
            --exit-code \
          || { echo "::error::schema.prisma has changes with no migration. Run 'npm run db:migrate' and commit the new migration."; exit 1; }

      # The check above cannot see CHECK and exclusion constraints, triggers, functions or expression
      # indexes. Loading schema.sql into a second database and comparing schema dumps covers them.
      - name: Check schema.sql matches the migrations
        run: |
          set -o pipefail
          pg="${{ job.services.postgres.id }}"
          docker exec "$pg" createdb -U ci schema_sql
          docker exec -i "$pg" psql -U ci -d schema_sql -q -v ON_ERROR_STOP=1 < apps/backend/src/db/schema.sql
          for db in ci schema_sql; do
            docker exec "$pg" pg_dump -U ci -d "$db" --schema-only -T _prisma_migrations | grep -vE '^\\(un)?restrict ' > "$RUNNER_TEMP/$db.sql"
          done
          diff -u "$RUNNER_TEMP/ci.sql" "$RUNNER_TEMP/schema_sql.sql" \
          || { echo "::error::src/db/schema.sql and the migrations build different schemas. Change both together."; exit 1; }

      - name: Check every updated_at column has its trigger
        run: |
          missing=$(docker exec -i "${{ job.services.postgres.id }}" psql -U ci -d ci -tA -v ON_ERROR_STOP=1 <<'SQL'
          SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'
          JOIN pg_attribute a ON a.attrelid = c.oid AND a.attname = 'updated_at' AND NOT a.attisdropped
          WHERE c.relkind = 'r'
            AND NOT EXISTS (SELECT 1 FROM pg_trigger t JOIN pg_proc p ON p.oid = t.tgfoid
                            WHERE t.tgrelid = c.oid AND p.proname = 'set_updated_at');
          SQL
          )
          [ -z "$missing" ] || { echo "::error::No set_updated_at trigger on: $missing. Add one in the migration and in schema.sql."; exit 1; }

      - name: Run seed script
        run: npm run db:seed

  # Builds the production images without pushing them, so a broken
  # Dockerfile fails here instead of at deploy time.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, customer-web, staff-web]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          # Placeholders: the frontend images only need these at build time.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci_placeholder
            VITE_API_URL=http://localhost:8080
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

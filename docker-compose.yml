services:
  postgres:
    image: postgres:16-alpine
    container_name: airline_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-airline_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d airline_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage (replaces MinIO, whose official images were
  # removed from Docker Hub and quay.io in Sept 2026).
  # S3 API: http://localhost:8333
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: airline_seaweedfs
    restart: always
    command: server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - seaweedfsdata:/data
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json

  # One-shot job: creates the two buckets, then exits.
  # Seeing airline_seaweedfs_init exit with code 0 is expected.
  seaweedfs-create-buckets:
    image: chrislusf/seaweedfs:latest
    container_name: airline_seaweedfs_init
    depends_on:
      - seaweedfs
    restart: 'no'
    entrypoint: /bin/sh -c
    command: >
      "until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>&1 | grep -q airline-private; do
      echo 'Creating buckets (waiting for SeaweedFS to be ready)...';
      echo 's3.bucket.create -name airline-public' | weed shell -master=seaweedfs:9333;
      echo 's3.bucket.create -name airline-private' | weed shell -master=seaweedfs:9333;
      sleep 3;
      done;
      echo 'Buckets ready.'"

volumes:
  pgdata:
  seaweedfsdata:

# Needs Docker Compose >= 2.23.1 (Docker Desktop is recent enough).
# Local-development credentials only — do not reuse in production.
configs:
  seaweedfs_s3:
    content: |
      {
        "identities": [
          {
            "name": "anonymous",
            "actions": ["Read:airline-public", "List:airline-public"]
          },
          {
            "name": "app",
            "credentials": [
              { "accessKey": "${S3_ACCESS_KEY:-devaccesskey}", "secretKey": "${S3_SECRET_KEY:-devsecretkey}" }
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          }
        ]
      }

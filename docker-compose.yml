services:
  postgres:
    image: postgres:16-alpine
    container_name: airline_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-airline_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: airline_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    container_name: airline_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadminpassword; do sleep 1; done;
      mc mb --ignore-existing local/airline-public;
      mc mb --ignore-existing local/airline-private;
      mc anonymous set download local/airline-public;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: airline-backend:test
    container_name: airline_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/airline_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  customer-web:
    image: airline-customer-web:test
    container_name: airline_customer_web
    restart: always
    ports:
      - "5151:80"

  staff-web:
    image: airline-staff-web:test
    container_name: airline_staff_web
    restart: always
    ports:
      - "6161:80"

volumes:
  pgdata:
  miniodata: